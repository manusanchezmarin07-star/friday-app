name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      friday_host:
        description: 'IP o dominio del backend (ej: 192.168.1.50 o mi-tunnel.trycloudflare.com)'
        required: true
        default: '192.168.1.100'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add iOS microphone & photo permissions
        run: |
          /usr/libexec/PlistBuddy -c \
            "Add :NSMicrophoneUsageDescription string 'F.R.I.D.A.Y. necesita el micrófono para notas de voz'" \
            ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryUsageDescription string 'F.R.I.D.A.Y. necesita acceso a fotos para enviar capturas de báscula'" \
            ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'F.R.I.D.A.Y. necesita la cámara para hacer fotos'" \
            ios/Runner/Info.plist || true

      - name: Build iOS (sin firma — para AltStore)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=FRIDAY_HOST=${{ github.event.inputs.friday_host }}

      - name: Empaquetar como IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FRIDAY.ipa Payload/
          rm -rf Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-iOS
          path: FRIDAY.ipa
          retention-days: 7
