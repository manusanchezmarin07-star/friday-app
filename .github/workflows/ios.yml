name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      friday_host:
        description: 'Backend IP or domain (e.g. 100.x.x.x or tunnel.trycloudflare.com)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git and sync with remote
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve backend host
        id: host
        run: |
          HOST="${{ github.event.inputs.friday_host }}"
          if [ -z "$HOST" ]; then
            HOST="${{ secrets.FRIDAY_HOST_DEFAULT }}"
          fi
          if [ -z "$HOST" ]; then
            echo "::error::No FRIDAY_HOST provided. Pass it as input or set FRIDAY_HOST_DEFAULT secret."
            exit 1
          fi
          echo "value=$HOST" >> "$GITHUB_OUTPUT"

      - name: Get app version
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SEMVER=$(echo "$RAW" | sed 's/+.*//')
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "full=${SEMVER}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Add iOS permissions to Info.plist
        run: |
          plist="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Add :NSMicrophoneUsageDescription string 'F.R.I.D.A.Y. needs the microphone for voice notes'" \
            "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryUsageDescription string 'F.R.I.D.A.Y. needs photo library access'" \
            "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'F.R.I.D.A.Y. needs the camera to take photos'" \
            "$plist" 2>/dev/null || true

      - name: Build iOS (unsigned — for AltStore)
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=FRIDAY_HOST=${{ steps.host.outputs.value }}

      - name: Package IPA
        id: ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FRIDAY.ipa Payload/
          rm -rf Payload
          IPA_SIZE=$(wc -c < FRIDAY.ipa | tr -d ' ')
          echo "size=$IPA_SIZE" >> "$GITHUB_OUTPUT"

      - name: Update and commit AltStore source JSON
        run: |
          VERSION="${{ steps.version.outputs.full }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/latest/download/FRIDAY.ipa"
          IPA_SIZE="${{ steps.ipa.outputs.size }}"

          jq --arg v "$VERSION" \
             --arg d "$DATE" \
             --arg url "$DOWNLOAD_URL" \
             --argjson size "${IPA_SIZE:-0}" \
             '.apps[0].versions = [{"version": $v, "date": $d, "downloadURL": $url, "size": $size, "localizedDescription": "Build automatico desde GitHub Actions"}]' \
             altstore-source.json > altstore-source.tmp.json \
          && mv altstore-source.tmp.json altstore-source.json

          git add altstore-source.json
          git diff --staged --quiet \
            || git commit -m "ci: AltStore source → build #${{ github.run_number }} (v${{ steps.version.outputs.full }})"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v${{ steps.version.outputs.full }}
          name: "iOS v${{ steps.version.outputs.semver }} — Build #${{ github.run_number }}"
          body: |
            **Host:** `${{ steps.host.outputs.value }}`
            **Commit:** ${{ github.sha }}

            ### Install with AltStore
            1. Add source: `https://raw.githubusercontent.com/${{ github.repository }}/main/altstore-source.json`
            2. Install or update F.R.I.D.A.Y. from the source tab.
          files: FRIDAY.ipa
          make_latest: true
